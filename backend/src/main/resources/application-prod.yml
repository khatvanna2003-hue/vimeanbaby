spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Neon serverless: keep connections short-lived
      max-lifetime: 300000
      connection-timeout: 20000
  jpa:
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.vimeanbaby: INFO
